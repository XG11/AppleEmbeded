; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:firmware]
platform = teensy
board = teensy40
framework = arduino

upload_port = /dev/cu.usbmodem201104101
monitor_speed = 115200

build_src_filter =
    +<firmware/>
    +<ADS1220.cpp>
    +<lsm6dso32.cpp>


[env:loadcell_test]
platform = teensy
board = teensy40
framework = arduino

upload_port = /dev/cu.usbmodem150585901
monitor_speed = 115200

build_src_filter =
    +<loadcell_test/>
    +<ADS1220.cpp>

[env:station]
platform = teensy
board = teensy40
framework = arduino

upload_port = /dev/cu.usbmodem150585901
monitor_speed = 115200

build_src_filter =
    +<station/>